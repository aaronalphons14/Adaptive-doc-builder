[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autodoc-gov"
version = "0.1.0"
description = "Self-assembling, compliance-by-construction document generation platform for government departments"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Principal Software Architect" }
]
dependencies = [
    "pydantic>=2.7.0",
    "jinja2>=3.1.3",
    "python-docx>=1.1.0",
    "weasyprint>=61.0",
    "reportlab>=4.1.0",
    "pyyaml>=6.0.1",
    "typer>=0.12.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "qrcode>=7.4.2",
    "pillow>=10.2.0",
    "markdown>=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "types-PyYAML>=6.0.12",
    "httpx>=0.27.0",
]

[project.scripts]
autodoc = "autodoc.cli.main:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

